<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Sudoku</title>
    <style>
      html,
      body {
        /* Prevent mobile page reload during swipe-down */
        overscroll-behavior: none;
      }
      body {
        margin: 0;
        width: 100%;

        /* These are the portions which don't have deleterious effects on desktop of the
         * "Prevent mobile address bar from hiding/showing repeatedly when swiping up & down"
         * process. The parts that DO have bad side effects are set programmatically after
        *  mobile detection, in Initializer.js.
         */
        height: 100dvh;
        position: fixed;
        -webkit-overflow-scrolling: touch;
      }

      img {
        user-drag: none;
        -webkit-user-drag: none;
      }

      #vueApp {
        position: absolute;
        width: 100%;
        height: 100%;
        z-index: 1;
        pointer-events: none;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "vue": "https://unpkg.com/vue@3/dist/vue.runtime.esm-bundler.js"
        }
      }
    </script>
    <script type="module" src="./app/Main.js"></script>
  </head>
  <body>
    <div id="vueApp"></div>
  </body>
</html>
